<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123b32">
  <title>Mama Wallet</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to wallet</a>
  <header class="topbar">
    <div class="shell topbar-content">
      <a class="brand" href="/" aria-label="Mama Wallet home">
        <img src="/icon-192.png" alt="" width="40" height="40">
        <span>Mama Wallet</span>
      </a>
      <span id="role" class="role">Demo wallet</span>
    </div>
  </header>
  <main id="main" class="shell" tabindex="-1">
    <p id="notice" role="status" aria-live="polite" class="notice" hidden></p>
    <div id="screen" aria-busy="true"><h1>Opening your wallet…</h1></div>
  </main>
  <dialog id="payment-dialog" aria-labelledby="payment-title">
    <form id="payment-form">
      <h2 id="payment-title">Make a payment</h2>
      <p id="payment-description"></p>
      <label id="amount-label">Amount in demo credits
        <input id="amount" required type="text" inputmode="numeric" pattern="[0-9]{1,8}" maxlength="8" autocomplete="off">
      </label>
      <p id="payment-error" role="alert" hidden></p>
      <div class="actions">
        <button type="submit" id="payment-next" class="primary">Review payment</button>
        <button type="button" id="payment-cancel">Cancel</button>
      </div>
    </form>
  </dialog>
  <footer class="shell">Demo mode <span aria-hidden="true">·</span> No real money moves</footer>
</body>
</html>
