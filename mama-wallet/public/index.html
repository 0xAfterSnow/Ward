<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#123b32">
  <title>Mama Wallet</title>
  <meta name="description" content="A wallet demo for sending money home with family spending rules.">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to wallet</a>
  <header class="topbar">
    <div class="shell topbar-content">
      <a class="brand" href="/" aria-label="Mama Wallet home">
        <img class="brand-wordmark" src="/brand/mama-wallet-logo.webp" alt="Mama Wallet" width="180" height="60">
      </a>
      <span id="role" class="role">Demo wallet</span>
      <button id="bigger" class="outline" type="button" aria-pressed="false" hidden>Bigger text</button>
    </div>
    <p id="demo-chip" class="demo-header-chip" hidden>Demo, no real money moves</p>
  </header>
  <main id="main" class="shell" tabindex="0">
    <div id="notice" role="status" aria-live="polite" class="notice" tabindex="-1" hidden></div>
    <div id="screen" aria-busy="true"><h1>Opening your wallet…</h1><div class="skeleton" aria-hidden="true"></div></div>
  </main>
  <dialog id="wallet-dialog" aria-labelledby="dialog-title">
    <form id="wallet-form"></form>
  </dialog>
  <footer class="shell">Demo, no real money moves</footer>
</body>
</html>
